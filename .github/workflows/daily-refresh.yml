name: 每日自动刷新国家队ETF报表

on:
  schedule:
    # 刷新时刻(北京时间): 每周一至周五 23:00 跑一次
    # A股只在周一至周五交易, 故限定工作日即可覆盖全部交易日
    # 代价: 若交易所当日份额在 23:00 尚未发布, 报表最新数据日会滞后一天;
    #       不会丢历史 —— 增量窗口回溯最近12天, 下一次运行自动补齐
    # 数据未推进时 refresh.py 会沿用旧时间戳使输出字节不变, 工作流跳过提交(不产生冗余提交); 数据滞后时脚本会等待重试抓取
    # cron 为 UTC(北京=UTC+8); 星期字段 1-5 = 周一至周五, 禁止用 7
    - cron: "0 15 * * 1-5"   # 23:00 北京 周一至周五
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      A_STOCK_API_KEY: ${{ secrets.A_STOCK_API_KEY }}
    # 不加这行的默认上限是 360 分钟(6 小时)：某个数据接口不返回时任务会一直挂着，
    # 白占一个并发位，且日志要等很久才看得到。
    # 实测正常一轮 7~10 分钟(refresh.py 数据滞后自检最多再等 150s×2=300s), 极端情况约 15 分钟;
    # 25 分钟留足余量, 真超了说明是卡死而不是算得慢, 直接中断、等下一次调度重跑即可。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # 份额历史缓存已纳入仓库(_etf_shares_cache.json), checkout即得完整5年基线;
      # refresh.py 每次增量拉取并写回, 下方提交阶段将更新后的缓存一并提交回推, 云端自持不依赖本地/actions-cache
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        # pandas 3.x 有破坏性变更（Copy-on-Write / 字符串 dtype），无人值守锁 <3。
        run: pip install "pandas<3" "numpy<3" "requests<3" "openpyxl<4"

      - name: 运行刷新脚本(拉份额/净值/K线, 计算净买卖, 生成报表)
        run: python refresh.py

      # refresh.py 结束时会写 _etf_data.json(完整数据)。这里先提交它,
      # 再由此提炼出下游要用的三份小文件(latest.json / llms.txt / snapshot.md)。
      # 顺序不能反: make_summary.py 读的是 _etf_data.json。
      - name: 提炼摘要(给 Apps Script 邮件脚本与大模型读)
        run: |
          if [ -f _etf_data.json ]; then
            python make_summary.py
          else
            echo "_etf_data.json 缺失, 跳过摘要生成"
          fi

      - name: 将生成报表复制为 index.html 并提交(含份额缓存与摘要回写)
        run: |
          cp "国家队ETF每日净买入卖出报表.html" index.html
          # 数据有效性守卫：关键产物必须存在、非空且 JSON 合法。
          # 不做「必须是今天」的判定：节假日 / 披露滞后属正常（见 README 维护须知）。
          for f in _etf_data.json latest.json index.html llms.txt; do
            test -s "$f" || { echo "::error::守卫失败：$f 缺失或为空"; exit 1; }
            case "$f" in *.json) python3 -m json.tool "$f" >/dev/null || { echo "::error::$f 不是合法 JSON"; exit 1; } ;; esac
          done
          echo "数据有效性守卫通过"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _etf_shares_cache.json _etf_data.json
          git add latest.json llms.txt snapshot.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "报表无变化, 跳过提交"
          else
            git commit -m "chore: 每日自动刷新国家队ETF净买卖报表 ($(date +%F\ %T) 北京+8)"
            # 脚本抓取耗时较长, 期间若有人往 main 推过提交, 直接 push 会被拒; 先 rebase 再推
            git pull --rebase origin main || { echo "rebase 失败, 交由下一次调度重试"; exit 1; }
            git push
          fi